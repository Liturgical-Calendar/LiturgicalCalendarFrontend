# 4, to agree with prettier's tabWidth (see .prettierrc) and with the 4-space
# indentation PSR-12 and the JS sources already use. Left at the default 2, the
# two tools fight over every nested list `yarn format:md` touches.
MD007:
  indent: 4
MD013:
  line_length: 180
  code_blocks: false
  tables: false
MD024:
  siblings_only: true
MD025:
  front_matter_title: ""
MD029:
  style: one_or_ordered
MD036: false
MD033:
  allowed_elements:
    - img
    - a
    - table
    - thead
    - tbody
    - tr
    - th
    - td
    - li
    - ul
    - ol
    - kbd
    - style
MD041: false
MD046:
  style: fenced
# Emphasis and strong styles are the ones prettier writes; it has no option for
# either, so any other choice would be undone by `yarn format:md`.
MD049:
  style: underscore
MD050:
  style: asterisk
MD060:
  style: aligned

# LiturgicalCalendar Development Stack
# Run with: docker compose up -d
#
# SETUP WORKFLOW:
#   1. Start the stack:
#        docker compose up -d
#   2. Configure Zitadel (creates project, roles, OIDC apps):
#        ./scripts/setup-zitadel.sh --update-env
#   3. Restart app services to pick up new credentials:
#        docker compose up -d --force-recreate litcal-api litcal-frontend litcal-tests
#
#   Or do it all in one step:
#        ./scripts/setup-zitadel.sh --update-env --docker-init
#
# After starting, access:
#   - Frontend:        http://localhost:3000
#   - API:             http://localhost:8000
#   - Test Interface:  http://localhost:3003 (default: admin/admin)
#   - Zitadel Console: http://localhost:8080/ui/console
#   - Adminer (DB UI): http://localhost:8088
#   - Mailpit (Email): http://localhost:8025
#
# Default Zitadel admin: root@liturgicalcalendar.localhost / RootPassword1!

services:
  # ============================================================================
  # PostgreSQL Database (shared by Zitadel and LiturgicalCalendar API)
  # ============================================================================
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-litcal.sql:ro
    networks:
      - litcal

  # ============================================================================
  # Zitadel Identity Provider
  # ============================================================================
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters"'
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false

      # Database
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

      # Login V2 client machine user
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-data/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login V2 Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Enable Login V2
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8081/ui/v2/login
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8081/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?samlRequest=

      # Admin machine user (PAT for setup script)
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-data/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: api-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: API Admin Machine User
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Organization and human admin
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "LiturgicalCalendar"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: root
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: RootPassword1!

      # SMTP (Mailpit for local email capture)
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: false
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@liturgicalcalendar.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: LiturgicalCalendar

      ZITADEL_LOG_LEVEL: debug
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    user: "0"
    volumes:
      - zitadel_data:/zitadel-data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:3000"
    networks:
      - litcal
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Mailpit - Local email capture for Zitadel notifications
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - litcal

  # Login V2 - Next.js based login UI
  login:
    image: ghcr.io/zitadel/zitadel-login:latest
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel-data/login-client.pat
      EMAIL_VERIFICATION: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); const req = http.get('http://localhost:3000/ui/v2/login', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(5000, () => { req.destroy(); process.exit(1); });"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: service:zitadel
    user: "0"
    volumes:
      - zitadel_data:/zitadel-data:ro
    depends_on:
      zitadel:
        condition: service_healthy
        restart: false

  # Adminer - Database management UI
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: lucas-sandery
    networks:
      - litcal
    depends_on:
      - db

  # ============================================================================
  # LiturgicalCalendar Application Services
  # ============================================================================
  litcal-api:
    image: litcal-api:latest
    build: https://github.com/Liturgical-Calendar/LiturgicalCalendarAPI.git#development
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      WS_HOST: "0.0.0.0"
      WS_PORT: 8082
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: litcal
      DB_USER: litcal
      DB_PASSWORD: litcal_secure_password
      ZITADEL_ISSUER: http://localhost:8080
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
      ZITADEL_MACHINE_TOKEN: ${ZITADEL_MACHINE_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "127.0.0.1:${WS_PORT:-8082}:8082"
    networks:
      - litcal
    # Run both the HTTP server and the WebSocket server
    command: >
      bash -c "
        php public/LitCalTestServer.php &
        php -S 0.0.0.0:8000 -t /var/www/html/public
      "
    depends_on:
      zitadel:
        condition: service_healthy

  litcal-frontend:
    image: litcal-frontend:latest
    build: https://github.com/Liturgical-Calendar/LiturgicalCalendarFrontend.git#development
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      API_BASE_PATH: ""
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      ACCURACY_TESTS_URL: http://localhost:${TESTS_PORT:-3003}
      ZITADEL_ISSUER: http://localhost:8080
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - litcal
    depends_on:
      - litcal-api

  litcal-tests:
    image: litcal-tests:latest
    build: https://github.com/Liturgical-Calendar/UnitTestInterface.git#main
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      APP_ENV: production
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      API_BASE_PATH: ""
      WS_PROTOCOL: ws
      WS_HOST: localhost
      WS_PORT: ${WS_PORT:-8082}
      LITCAL_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
    ports:
      - "127.0.0.1:${TESTS_PORT:-3003}:3003"
    networks:
      - litcal
    depends_on:
      - litcal-api

networks:
  litcal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  zitadel_data:
    driver: local

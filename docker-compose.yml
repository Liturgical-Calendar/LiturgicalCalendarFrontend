services:
  litcal-api:
    image: litcal-api:latest
    build: https://github.com/Liturgical-Calendar/LiturgicalCalendarAPI.git#development
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      WS_HOST: "0.0.0.0"
      WS_PORT: 8082
    ports:
      - ${API_PORT:-8000}:8000
      - ${WS_PORT:-8082}:8082
    # Run both the HTTP server and the WebSocket server
    command: >
      bash -c "
        php public/LitCalTestServer.php &
        php -S 0.0.0.0:8000 -t /var/www/html/public
      "

  litcal-frontend:
    image: litcal-frontend:latest
    build: https://github.com/Liturgical-Calendar/LiturgicalCalendarFrontend.git#development
    restart: unless-stopped
    # extra_hosts allows the container to reach the API via localhost:<published_port>
    # This is needed because $apiBaseUrl is used for both server-side PHP requests
    # and client-side JavaScript requests (browser), so it must resolve from both contexts
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      APP_ENV: development
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      ACCURACY_TESTS_URL: http://localhost:${TESTS_PORT:-3003}
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    depends_on:
      - litcal-api

  litcal-tests:
    image: litcal-tests:latest
    build: https://github.com/Liturgical-Calendar/UnitTestInterface.git#main
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_PROTOCOL: http
      API_HOST: localhost
      API_PORT: ${API_PORT:-8000}
      WS_PROTOCOL: ws
      WS_HOST: localhost
      WS_PORT: ${WS_PORT:-8082}
      LITCAL_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - ${TESTS_PORT:-3003}:3003
    depends_on:
      - litcal-api

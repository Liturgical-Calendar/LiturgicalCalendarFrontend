# Use the classic node_modules linker instead of Plug'n'Play.
#
# Newer Playwright resolves its package export map by calling
# require.resolve(spec, { conditions }). Yarn's PnP require shim rejects the
# `conditions` option ("Some options passed to require() aren't supported by
# PnP yet"), so `yarn playwright …` crashes before any test runs. Empirically
# 1.57 (the prior pin) ran fine under PnP; the 1.57 -> 1.61 bump introduced the
# crash. The same limitation now also affects Vite 7.2+. node_modules sidesteps
# entirely. This project ships no runtime JS dependencies (devDependencies
# only — it is a PHP frontend), so there is no production cost to the switch.
nodeLinker: node-modules

# Supply-chain cooldown: refuse to resolve any npm package version published
# less than 7 days ago, mirroring the Dependabot `cooldown: default-days: 7`
# policy in .github/dependabot.yaml. Reduces exposure to a compromised or
# yanked release. (Requires Yarn >= 4.10.)
npmMinimalAgeGate: "7d"

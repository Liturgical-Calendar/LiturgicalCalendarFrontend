# Docker Compose Override Example
# Copy this file to docker-compose.override.yml to build from local repos
# instead of GitHub. Only include the services you want to override.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # Edit to keep only the services you need
#   docker compose up --build
#
# The override file is automatically merged with docker-compose.yml.
# Services not listed here continue to build from GitHub.

services:
  # These services use the same image as litcal-api — override build context together
  db-init:
    build:
      context: ../LiturgicalCalendarAPI

  openfga-setup:
    build:
      context: ../LiturgicalCalendarAPI

  litcal-api:
    build:
      context: ../LiturgicalCalendarAPI
    environment:
      # Shared JWT secret from .env — overrides the placeholder baked into the
      # image's seeded .env.local so that host-side consumers of the API's JWT
      # cookies (e.g. UnitTestInterface JwtAuth via .env.development) validate them.
      JWT_SECRET: ${JWT_SECRET}
    # Live-reload the API source so PHP edits reflect without rebuilding the
    # image. Explicit dir mounts (not the whole repo root) so vendor/, cache/,
    # logs/, engineCache/ and the seeded .env.local stay as the image built them.
    volumes:
      # Code dirs the API never writes to → :ro. vendor/ is deliberately NOT
      # mounted so the image's `composer install` (optimized autoloader) is used;
      # adding a NEW class file may need a `composer dump-autoload` in-container.
      - ../LiturgicalCalendarAPI/src:/var/www/html/src:ro
      - ../LiturgicalCalendarAPI/public:/var/www/html/public:ro
      # jsondata is :rw, NOT :ro. The API PERSISTS PUTed test definitions to
      # jsondata/tests/<name>.json (TestsHandler::file_put_contents) and other
      # source-data writes here; a :ro mount would fail those writes with a
      # read-only-filesystem error. :rw lets writes land in the host repo (so
      # authored tests can be committed) and reflects source-data edits live.
      - ../LiturgicalCalendarAPI/jsondata:/var/www/html/jsondata:rw

  litcal-frontend:
    build:
      context: .
    environment:
      # Shared JWT secret so the frontend's AuthHelper legacy-JWT fallback can
      # validate access tokens issued by the API in development mode (ADMIN_USERNAME
      # / ADMIN_PASSWORD_HASH not set → API falls back to HS256 with this secret).
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
    # Wire in the dev-server router (see router.php). `command:` rather than a
    # Dockerfile CMD change, so the image stays untouched: `php -S` serves any file
    # under the docroot verbatim, dotfiles included, and the root mount below puts
    # this whole repository there — .env.local, .env*.bak.*, .git and all. The
    # router 404s any path segment starting with a dot and defers everything else
    # to the built-in handler, so real files and the index.php fallback are
    # unchanged.
    command: ["php", "-S", "0.0.0.0:3000", "-t", "/var/www/html", "router.php"]
    # Live-reload: mount the repo ROOT read-only so edits reflect without rebuilding
    # the image. No per-page entries to maintain — a new top-level page is picked up
    # with no change here.
    #
    # The root, deliberately, rather than a mount per file. A single-FILE bind pins
    # that file's inode, and git REPLACES files rather than editing them in place —
    # so a branch switch left the container serving stale content, and when the
    # inode was swapped outright the container failed to start at all
    # ("error mounting ... no such file or directory"). Binding the directory pins
    # the directory's inode instead, which git never replaces. Same fix as
    # litcal-tests (#472); see #473 for why this service needed more care.
    #
    # The hand-maintained list this replaces had already drifted: it still mounted
    # decrees.php, renamed to admin-decrees.php long ago, so one real page silently
    # served the image's copy and docker kept recreating an empty decrees.php/
    # directory in the repo root.
    volumes:
      - .:/var/www/html:ro
      # The image's `composer install` result, kept in preference to the host's
      # vendor/ (dev dependencies, built against the host's PHP). An anonymous
      # volume initialises from the image, shadowing the host directory.
      - /var/www/html/vendor
      # Runtime write targets. The root mount above is :ro so the container can
      # never modify host source; these three are the carve-outs it must write to.
      # assets/json is a GitHub release-info cache (see includes/common.php); the
      # examples ones are the PHP example's cache and logs. All gitignored.
      - ./assets/json:/var/www/html/assets/json:rw
      - ../examples/php/cache:/var/www/html/examples/php/cache:rw
      - ../examples/php/logs:/var/www/html/examples/php/logs:rw
      # The examples live in a separate repo, symlinked here as the gitignored
      # examples/ -> ../examples. A bind mount does not follow that symlink into
      # the container, so the target still needs mounting explicitly or
      # examples.php's assets 404.
      - ../examples:/var/www/html/examples:ro
  litcal-tests:
    build:
      context: ../UnitTestInterface
    environment:
      # Shared JWT secret from .env (same value as litcal-api) so the test UI's
      # PHP-side JwtAuth can validate API-issued cookies (results.php etc.).
      JWT_SECRET: ${JWT_SECRET}
      # Server-side PHP -> API calls (admin.php) must route over the docker
      # network; 'localhost' inside the container is its own loopback. Same
      # pattern as litcal-frontend's API_INTERNAL_URL.
      API_INTERNAL_URL: http://litcal-api:8000
    # Live-reload: mount the repo ROOT read-only so edits reflect without rebuilding
    # the image (UnitTestInterface has no build step). No per-page entries to
    # maintain — a new top-level page is picked up with no change here.
    #
    # The root, deliberately, rather than a mount per file. A single-FILE bind pins
    # that file's inode, and git REPLACES files rather than editing them in place —
    # so a branch switch left the container serving stale content, and when the
    # inode was swapped outright the container failed to start at all
    # ("error mounting ... no such file or directory"). Binding the directory pins
    # the directory's inode instead, which git never replaces, so index.php,
    # resources.php and assets/ all hot-reload across branch switches with no
    # `--force-recreate`.
    #
    # Two paths are shadowed back out of that root mount:
    volumes:
      - ../UnitTestInterface:/var/www/html:ro
      # The image's `composer install --no-dev --optimize-autoloader` result, kept
      # in preference to the host's vendor/ (which carries dev dependencies and is
      # built against the host's PHP). An anonymous volume initialises from the
      # image, so it shadows the host directory without hiding it from the host.
      - /var/www/html/vendor
      # `php -S` serves any file under the docroot, dotfiles included, so the root
      # mount would publish the host's .env.development — which holds JWT_SECRET —
      # at http://localhost:3003/.env.development. Shadow it with an empty file.
      # Config still arrives via `environment:` above; phpdotenv's immutable loader
      # cannot override a variable Docker has already set, so nothing is lost.
      - /dev/null:/var/www/html/.env.development:ro
      # Persisted test runs — shared with the host checkout (rw: the endpoint
      # saves/prunes run files here; the host dir is gitignored).
      - ../UnitTestInterface/results:/var/www/html/results:rw

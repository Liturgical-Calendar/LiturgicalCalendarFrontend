name: Update POTs

on:
  push:
    branches: [ development ]
    paths: [ '**.php' ]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update source file translation strings
        id: update_pot
        run: |
          sudo apt-get install -y gettext
          xgettext --from-code=UTF-8 --add-comments='translators:' --keyword="pgettext:1c,2" --keyword="ngettext:1,2" -L PHP -o i18n/litcal.pot index.php usage.php easter.php about.php examples.php translations.php liturgyOfAnyDay.php src/LitColor.php src/LitCommon.php src/LitGrade.php src/Utilities.php src/FormControls.php layout/header.php layout/footer.php includes/login-modal.php includes/messages.php includes/functions.php includes/admin-blocks.php includes/admin-decrees-card.php includes/admin-tests-card.php admin-decrees.php admin-permissions.php admin-tests.php permission-requests.php admin-applications.php admin-dashboard.php admin-users.php developer-dashboard.php temporale.php sanctorale.php user-profile.php
          echo "POT_LINES_CHANGED=$(git diff -U0 | grep '^[+|-][^+|-]' | grep -Ev '^[+-]"POT-Creation-Date' | wc -l)" >> $GITHUB_OUTPUT

      # Direct push to development is blocked by branch protection (required
      # status checks). Open a PR instead and let auto-merge land it once
      # CodeQL + Analyze (javascript) go green on the .pot-only diff.
      #
      # The PR MUST be created with a PAT (the WORKFLOW_AUTO_MERGE_PAT token,
      # stored as the org Actions secret WORKFLOW_AUTOMERGE_PAT), not the
      # default GITHUB_TOKEN: GitHub deliberately does not trigger `pull_request`
      # workflow runs for PRs opened by GITHUB_TOKEN (recursion guard), so the
      # required status checks would never start and auto-merge would wait
      # forever. A PAT-authored PR triggers the checks normally. Falls back to
      # GITHUB_TOKEN when the secret is absent (same pattern as
      # dependabot-auto-merge.yml). NOTE: the PAT is rotated periodically (see
      # the rotation-reminder workflow); `secrets.WORKFLOW_AUTOMERGE_PAT` is the
      # secret name Actions resolves — it differs from the PAT's display name.
      - name: Open PR with regenerated POT
        if: ${{ steps.update_pot.outputs.POT_LINES_CHANGED > 0 }}
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.WORKFLOW_AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
          branch: chore/regenerate-pot
          delete-branch: true
          add-paths: i18n/litcal.pot
          commit-message: 'chore(i18n): regenerate i18n/litcal.pot from source files'
          title: 'chore(i18n): regenerate i18n/litcal.pot'
          body: |
            Automated regeneration of `i18n/litcal.pot` from the project source files.

            Generated by the [Update POTs workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge

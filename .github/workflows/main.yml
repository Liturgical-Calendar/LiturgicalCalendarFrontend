name: Update POTs

on:
  push:
    branches: [ development ]
    paths: [ '**.php' ]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update source file translation strings
        id: update_pot
        run: |
          sudo apt-get install -y gettext
          xgettext --from-code=UTF-8 --add-comments='translators:' --keyword="pgettext:1c,2" --keyword="ngettext:1,2" -L PHP -o i18n/litcal.pot index.php usage.php easter.php about.php examples.php translations.php liturgyOfAnyDay.php src/LitColor.php src/LitCommon.php src/LitGrade.php src/Utilities.php src/FormControls.php layout/header.php includes/login-modal.php includes/messages.php includes/functions.php
          echo "POT_LINES_CHANGED=$(git diff -U0 | grep '^[+|-][^+|-]' | grep -Ev '^[+-]"POT-Creation-Date' | wc -l)" >> $GITHUB_OUTPUT

      # Direct push to development is blocked by branch protection (required
      # status checks). Open a PR instead and let auto-merge land it once
      # CodeQL + Analyze (javascript) go green on the .pot-only diff.
      - name: Open PR with regenerated POT
        if: ${{ steps.update_pot.outputs.POT_LINES_CHANGED > 0 }}
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/regenerate-pot
          delete-branch: true
          add-paths: i18n/litcal.pot
          commit-message: 'chore(i18n): regenerate i18n/litcal.pot from source files'
          title: 'chore(i18n): regenerate i18n/litcal.pot'
          body: |
            Automated regeneration of `i18n/litcal.pot` from the project source files.

            Generated by the [Update POTs workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --auto --merge

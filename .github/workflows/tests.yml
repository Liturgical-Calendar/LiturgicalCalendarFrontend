name: Tests

# Fast, service-free quality gates + unit tests on every PR/push.
# (End-to-end Playwright tests, which need the full docker stack, run in the
# separate "E2E" workflow.)

on:
  push:
    branches: [ development, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (parallel-lint · phpcs · phpstan · phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check (php-parallel-lint)
        run: composer parallel-lint

      - name: Code style (phpcs)
        run: composer lint

      - name: Static analysis (phpstan)
        run: composer analyse

      - name: Unit tests (phpunit)
        run: composer test

  js:
    name: JS (eslint · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Typecheck (e2e)
        run: yarn typecheck

  # Kept as a separate job from "js" on purpose: "JS (eslint · typecheck)" is a
  # required status check on the development branch, and this job is not (yet)
  # required — folding vitest into the js job would silently make it required.
  js-unit:
    name: JS unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests (vitest)
        run: yarn test:unit

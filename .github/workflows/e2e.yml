name: E2E

# End-to-end Playwright suite against the full docker stack
# (Postgres + Zitadel + OpenFGA + Mailpit + API + frontend).
#
# Triggers:
#   pull_request (frontend-affecting paths) — the PR's own frontend is built from
#     the checkout via docker-compose.ci.yml (COMPOSE_FILE on the job). Draft PRs
#     are skipped.
#   schedule (nightly) — safety-net run on the default branch, and the only
#     automated run that covers firefox and webkit.
#   workflow_dispatch — manual, with the `project` selector below.
# pull_request runs `rbac` + `chromium-ci` + `chromium-ci-auth` — the `automated`
# selector below. They used to run `rbac` alone, which meant the whole chromium
# project was guarded by nothing: `inputs` is empty for a schedule event, so the
# cron fell through the same `|| 'rbac'` default as everything else. Note that
# `inputs` is empty for a schedule event, which is why the cron is selected on
# `github.event_name` rather than on an input default. See playwright.config.ts
# for what is still excluded and why.
#
# The `project` workflow_dispatch input selects which Playwright project runs:
#   automated (default) — what pull_request runs
#   automated-nightly — what the cron runs: `automated` plus firefox and webkit.
#       Selected automatically for schedule events; also dispatchable by hand.
#   rbac — the scoped-admin-review RBAC suite (rbac-setup seeds users)
#   chromium-ci — the chromium specs needing no login (usage, liturgyOfAnyDay)
#   chromium-ci-auth — the calendar-data form specs (national / diocesan /
#       wider-region / missals). The `setup` project seeds a Zitadel admin and
#       logs it in through the real OIDC flow; it no longer uses the API's
#       legacy HS256 /auth/login, whose tokens auth/me.php could never accept
#       (issue #448).
#   chromium / firefox / webkit — the full per-browser projects. `chromium` is
#       now the same set as chromium-ci + chromium-ci-auth combined; firefox and
#       webkit are the cross-browser sweep, which PR runs do not cover — the
#       nightly does. Dispatch one of these to check a PR before merging.
#   all — every project
#
# litcal-api builds from #development (the merge target); only litcal-frontend is
# rebuilt from the checkout (docker-compose.ci.yml).

on:
  # Deliberately UNFILTERED. "E2E (Playwright + full docker stack)" is a required
  # status check on `development`, and GitHub's branch protection cannot tell
  # "skipped by path filter" from "still pending" — a path-filtered-away run
  # leaves the PR BLOCKED forever waiting on a context nothing reports.
  #
  # This used to be solved with a companion workflow (e2e-required-skip.yml) that
  # ran on `paths-ignore` and emitted the same check name instantly. That was
  # unsound: `paths` and `paths-ignore` are NOT complements. `paths` fires when
  # ANY changed file matches; `paths-ignore` fires when ANY changed file does
  # NOT match. A PR touching both a listed file and an unlisted one satisfied
  # both, so two runs published the same required context and the instant green
  # could satisfy branch protection while the real suite was still running.
  #
  # Instead the workflow always triggers and the `changes` job below decides,
  # in ONE place, whether the suite actually runs. Exactly one job ever reports
  # the required context: the `required` aggregator at the bottom.
  pull_request:
    # ready_for_review matters: the suite is skipped for drafts, so without this
    # a draft marked ready would keep whatever the aggregator last reported
    # until the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        type: choice
        default: automated
        options:
          # What pull_request runs: rbac + chromium-ci + chromium-ci-auth. Kept
          # as the dispatch default too, so a manual run reproduces a PR's own
          # checks unless you ask for something else.
          - automated
          # What the nightly cron runs: the above plus firefox and webkit.
          - automated-nightly
          - rbac
          - chromium-ci
          - chromium-ci-auth
          # The full chromium project — now equivalent to chromium-ci plus
          # chromium-ci-auth, since #453 closed the last exclusion. Automated
          # runs still take the two subsets, so a Zitadel outage cannot fail
          # the login-free specs along with the rest.
          - chromium
          - firefox
          - webkit
          - all

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    permissions:
      # paths-filter has no checkout to diff against, so it reads the PR's file
      # list from the API. Without this the step 403s and the gate never resolves.
      contents: read
      pull-requests: read
    outputs:
      # 'true' for any non-PR event (schedule / workflow_dispatch always run the
      # suite in full), otherwise whatever the path filter decided.
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: Filter frontend-affecting paths
        # The single source of truth for what "frontend-affecting" means.
        # NB: i18n/** is intentionally absent — translation-only PRs (e.g. Weblate)
        # don't change E2E behaviour, so they skip the ~7-min full-stack run. Any
        # translation-driven regression is still caught by the nightly `schedule`.
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'assets/**'
              - 'includes/**'
              - 'layout/**'
              - 'src/**'
              - '*.php'
              - 'e2e/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.ci.yml'
              - 'playwright.config.ts'
              - 'package.json'
              - 'yarn.lock'
              - '.pnp.cjs'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - '.github/workflows/e2e.yml'

  suite:
    name: E2E suite
    needs: changes
    runs-on: ubuntu-latest
    # Skip draft PRs — the heavy full-stack run isn't worth it until ready for review.
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # 45 covers the nightly, which is the long one. Measured from a scheduled run:
    # ~4.3 min fixed setup (the sequential image build is 3 min of it), 26 s to
    # install chromium, 2.6 min for `automated`'s 121 tests, 25 s teardown -- 7.8 min
    # total. The nightly adds firefox and webkit: 301 tests rather than 121, and three
    # browsers to install rather than one, which projects to ~13 min, ~16 with a 50%
    # margin, and ~26 in the pathological case where every added test fails and burns
    # both `--retries`. Re-measure if the suite grows a lot or the image build stops
    # being cached.
    timeout-minutes: 45
    env:
      # Build litcal-frontend from the checkout (the PR head) instead of the base
      # compose's #development git build, so the PR's frontend is what's tested.
      # See docker-compose.ci.yml. Applies to every `docker compose` call below.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the API repo (calendar source data)
        # Scenario 10 / 11c build their PATCH payload by reading the IT calendar JSON
        # from the API repo's jsondata/sourcedata (and gitRestoreApiData reverts there
        # locally). The docker stack runs the API as a container, but the host process
        # still needs the source files — check out the same ref the stack builds from.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Liturgical-Calendar/LiturgicalCalendarAPI
          ref: development
          path: api-repo
          persist-credentials: false

      - name: Seed env files
        # Both .env (compose) and .env.development (the host playwright process)
        # are gitignored; seed them from the example. setup-zitadel.sh and the
        # sync step below fill in the generated secrets.
        run: |
          cp .env.example .env
          cp .env.example .env.development

      - name: Build app images (sequential)
        # litcal-api and litcal-frontend share a BuildKit `type=cache` apt mount;
        # building them in parallel (as `up --build` / `build` do) collides on the
        # apt lock ("Could not get lock /var/lib/apt/lists/lock"). Build one at a time.
        run: |
          docker compose build litcal-api
          docker compose build litcal-frontend

      - name: Bring up the docker stack
        run: docker compose up -d --wait db zitadel openfga mailpit login litcal-api litcal-frontend

      - name: Bootstrap Zitadel
        run: ./scripts/setup-zitadel.sh --force-secrets --update-env

      - name: Resolve + propagate Zitadel & OpenFGA creds
        # Two gotchas, both fatal in a from-scratch CI bootstrap:
        #  1. openfga-setup creates the store INSIDE OpenFGA but does not write its id
        #     to the host .env, so litcal-api's `OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}`
        #     stays EMPTY → the API queries an empty store → isResourceAdmin() is always
        #     false → every resource-admin page redirects (no /admin/access-requests XHR).
        #  2. setup-zitadel writes ZITADEL_MACHINE_TOKEN only to compose .env (not
        #     .env.development), and a fresh bootstrap mints a new org id.
        # So resolve the live store/model + token/org and write them to BOTH .env (the
        # containers, picked up by the recreate below) AND .env.development (the host
        # playwright process), plus the host-reachable URLs. THEN recreate.
        run: |
          set -euo pipefail
          set_kv() {  # set_kv FILE KEY VALUE
            local file=$1 key=$2 val=$3
            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$file"
            else
              printf '%s=%s\n' "$key" "$val" >> "$file"
            fi
          }
          store=$(curl -sS http://localhost:8083/stores \
            | python3 -c "import sys,json;s=json.load(sys.stdin).get('stores',[]);print(s[0]['id'] if s else '')")
          model=$(curl -sS "http://localhost:8083/stores/$store/authorization-models" \
            | python3 -c "import sys,json;m=json.load(sys.stdin).get('authorization_models',[]);print(m[0]['id'] if m else '')")
          tok=$(grep '^ZITADEL_MACHINE_TOKEN=' .env | cut -d= -f2-)
          # Host-facing Zitadel URLs track ZITADEL_PORT, the same variable
          # docker-compose.yml publishes on. The `Host: localhost` header below is
          # separate and stays portless: it matches ZITADEL_EXTERNALDOMAIN, which
          # does not move.
          zitadel="http://localhost:${ZITADEL_PORT:-8080}"
          org=$(curl -sS "$zitadel/auth/v1/users/me" \
                  -H "Authorization: Bearer $tok" -H "Host: localhost" \
                | python3 -c "import sys,json;u=json.load(sys.stdin).get('user',{});print(u.get('details',{}).get('resourceOwner') or u.get('resourceOwner',''))")
          # Containers (.env): the API resolves admin scopes against this store/model.
          set_kv .env OPENFGA_STORE_ID "$store"
          set_kv .env OPENFGA_MODEL_ID "$model"
          # Host playwright (.env.development): the helpers hit the host-exposed ports.
          set_kv .env.development ZITADEL_MACHINE_TOKEN "$tok"
          set_kv .env.development ZITADEL_ORG_ID "$org"
          set_kv .env.development ZITADEL_ISSUER "$zitadel"
          set_kv .env.development OPENFGA_API_URL "http://localhost:8083"
          set_kv .env.development OPENFGA_STORE_ID "$store"
          set_kv .env.development OPENFGA_MODEL_ID "$model"
          set_kv .env.development MAILPIT_API_URL "http://localhost:8025"

      - name: Recreate app containers with the resolved creds
        run: docker compose up -d --wait --force-recreate litcal-api litcal-frontend

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies + browsers
        env:
          PROJECT: ${{ inputs.project || (github.event_name == 'schedule' && 'automated-nightly' || 'automated') }}
        run: |
          corepack enable
          yarn install --immutable
          # chromium is in every set on purpose. The `setup` project pins no
          # browser, so it runs on Playwright's default -- chromium -- and the
          # firefox and webkit projects both declare `dependencies: ['setup']`.
          # Installing firefox alone therefore fails in setup, before a single
          # firefox test runs, with chromium's executable reported missing.
          case "$PROJECT" in
            firefox)            browsers="chromium firefox" ;;
            webkit)             browsers="chromium webkit" ;;
            all)                browsers="chromium firefox webkit" ;;
            automated-nightly)  browsers="chromium firefox webkit" ;;
            *)                  browsers=chromium ;;   # automated, rbac, chromium, chromium-ci
          esac
          yarn playwright install --with-deps $browsers

      - name: Run E2E suite
        # GitHub Actions sets CI=true automatically; override it to empty so
        # reuseExistingServer (!CI) is TRUE and Playwright REUSES the docker stack's
        # api:8000 / frontend:3000 instead of starting its own server (which collides
        # on the port). --retries / --forbid-only restore the CI-mode behaviours that
        # an empty CI would otherwise switch off.
        env:
          CI: ""
          PROJECT: ${{ inputs.project || (github.event_name == 'schedule' && 'automated-nightly' || 'automated') }}
          API_REPO_PATH: ${{ github.workspace }}/api-repo
        run: |
          case "$PROJECT" in
            all)
              yarn playwright test --retries=2 --forbid-only
              ;;
            automated)
              # What pull_request runs. `rbac` is the long-standing suite;
              # `chromium-ci` is the login-free chromium specs and
              # `chromium-ci-auth` the calendar-data ones behind auth.setup.ts.
              # All three are needed: none covers another's pages. See
              # playwright.config.ts for what is still excluded and why.
              yarn playwright test --project=rbac --project=chromium-ci --project=chromium-ci-auth --retries=2 --forbid-only
              ;;
            automated-nightly)
              # What the cron runs: everything `automated` runs, plus the
              # cross-browser sweep. Nightly rather than per-PR because it
              # roughly triples install and run time, and this workflow reports a
              # REQUIRED status check -- the cost belongs on the safety net, not
              # on every PR. A firefox/webkit-only failure therefore surfaces
              # within a day of merge rather than at review time; run
              # `workflow_dispatch` with project=firefox/webkit/all to check a PR
              # before merging when it touches anything browser-sensitive.
              yarn playwright test --project=rbac --project=chromium-ci --project=chromium-ci-auth --project=firefox --project=webkit --retries=2 --forbid-only
              ;;
            *)
              yarn playwright test --project="$PROJECT" --retries=2 --forbid-only
              ;;
          esac

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Dump stack logs on failure
        # `--tail 400` on a single combined stream only shows the last few minutes of a
        # ~20+ minute job — it missed the early-suite failure window entirely on the run
        # that first surfaced this gap. Capture the FULL, untruncated log per service to
        # a file (so it's not bounded by the Actions log viewer either) and still print a
        # short combined tail for a quick glance in the step output.
        if: failure()
        run: |
          mkdir -p docker-logs
          for svc in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$svc" > "docker-logs/${svc}.log" 2>&1 || true
          done
          echo "--- last 400 lines (combined, quick glance; see docker-compose-logs artifact for full history) ---"
          docker compose logs --no-color --tail 400

      - name: Upload docker stack logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-logs
          path: docker-logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  required:
    # The ONLY job that reports the required "E2E (Playwright + full docker stack)"
    # context. It always runs, so the context is always reported exactly once —
    # whether the suite ran, was skipped as irrelevant, or was skipped as a draft.
    name: E2E (Playwright + full docker stack)
    needs: [changes, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the E2E gate
        env:
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          RESULT: ${{ needs.suite.result }}
        run: |
          # `skipped` is a pass: either no frontend-affecting path changed, or the
          # PR is still a draft. Anything else (failure / cancelled) must fail the
          # gate — never let a red or abandoned suite report green.
          case "$RESULT" in
            success)
              echo "E2E suite passed."
              ;;
            skipped)
              if [ "$FRONTEND" = 'true' ]; then
                echo "Suite was skipped on a draft PR; nothing to verify yet."
              else
                echo "No frontend-affecting paths changed; full stack not required."
              fi
              ;;
            *)
              echo "E2E suite result: $RESULT"
              exit 1
              ;;
          esac

# Specify a non-default branch for pull requests for composer dependencies

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days before proposing updates to newly published versions, to
    # reduce exposure to a compromised or yanked release (supply-chain).
    cooldown:
      default-days: 7
    # Raise pull requests for version updates
    # to composer packages against the `development` branch
    target-branch: "development"
    # Labels on pull requests for version updates
    labels:
      - "composer dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "development"
    labels:
      - "github-actions"

  # npm/Yarn devDependencies (eslint, playwright, typescript, markdownlint-cli2, …).
  # Yarn Berry is supported via package.json + yarn.lock. A bump of
  # markdownlint-cli2 here is also what retires the temporary js-yaml resolutions
  # override (see .github/workflows/js-yaml-resolution-reminder.yml).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "development"
    labels:
      - "javascript dependencies"
    # Batch npm updates into fewer PRs. Groups are matched in the order they are
    # declared — a dependency joins the FIRST group whose patterns match — so the
    # `eslint` group must precede the catch-all `dev-dependencies` group. eslint
    # and @eslint/js share a hard major-version lock (@eslint/js@10's shared
    # config references rules that only exist in eslint@10 core), so they must
    # bump together in a single PR or the config fails to load.
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
      dev-dependencies:
        patterns:
          - "*"
